<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Music Junkie thumbnail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800;900&display=block" rel="stylesheet">
<style>
  :root {
    --background: #121212;
    --surface: #1e1e1e;
    --surface-raised: #3a3a3a;
    --border: #2a2a2a;
    --foreground: #ffffff;
    --muted: #b3b3b3;
    --accent: #5cc8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 627px; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 620px 520px at 900px 330px, rgba(92, 200, 255, 0.16), transparent 70%),
      radial-gradient(ellipse 500px 360px at 80px 640px, rgba(92, 200, 255, 0.07), transparent 70%),
      var(--background);
    color: var(--foreground);
    font-family: "Figtree", system-ui, sans-serif;
    position: relative;
  }

  .copy {
    position: absolute;
    left: 72px;
    top: 0;
    bottom: 0;
    width: 540px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .mark {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 30px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.01em;
  }
  .mark svg { width: 40px; height: 40px; }
  h1 {
    margin-top: 26px;
    font-size: 58px;
    line-height: 1.04;
    font-weight: 900;
    letter-spacing: -0.03em;
  }
  h1 em { font-style: normal; color: var(--accent); }
  .sub {
    margin-top: 20px;
    font-size: 22px;
    line-height: 1.4;
    font-weight: 500;
    color: var(--muted);
  }
  .chips {
    margin-top: 32px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    font-size: 15px;
    font-weight: 700;
    padding: 7px 13px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--surface-raised);
    color: var(--foreground);
  }

  .phones { position: absolute; right: 36px; top: 0; width: 560px; height: 627px; }
  .phone {
    position: absolute;
    width: 220px;
    height: 476px;
    border-radius: 34px;
    padding: 7px;
    background: #050505;
    border: 1.5px solid #3a3a3a;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
    overflow: hidden;
  }
  .phone img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    border-radius: 27px;
  }
  .phone.left  { left: 14px;  top: 112px; transform: rotate(-7deg); opacity: 0.92; }
  .phone.right { left: 296px; top: 112px; transform: rotate(7deg);  opacity: 0.92; }
  .phone.center { left: 148px; top: 64px; width: 240px; height: 520px; z-index: 2; border-radius: 36px; }
  .phone.center img { border-radius: 29px; }
</style>
</head>
<body>
  <div class="copy">
    <div class="mark">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="11" fill="#5cc8ff"/>
        <rect x="9"  y="21" width="5" height="10" rx="1.5" fill="#06121a"/>
        <rect x="17.5" y="11" width="5" height="20" rx="1.5" fill="#06121a"/>
        <rect x="26" y="16" width="5" height="15" rx="1.5" fill="#06121a"/>
      </svg>
      Music Junkie
    </div>
    <h1>Every concert<br>you've been to, <em>logged.</em></h1>
    <p class="sub">Search setlist.fm, save the lineup, and get stats, yearly charts and leaderboards. Follow friends to see the shows you both went to.</p>
    <div class="chips">
      <span class="chip">Next.js</span>
      <span class="chip">TypeScript</span>
      <span class="chip">Supabase</span>
      <span class="chip">Postgres RLS</span>
      <span class="chip">Tailwind</span>
    </div>
  </div>

  <div class="phones" aria-hidden="true">
    <div class="phone left"><img src="../screenshots/log.png" alt=""></div>
    <div class="phone right"><img src="../screenshots/add-festival.png" alt=""></div>
    <div class="phone center"><img src="../screenshots/stats-charts.png" alt=""></div>
  </div>
</body>
</html>
